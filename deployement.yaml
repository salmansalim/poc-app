apiVersion: apps/v1

kind: Deployment

metadata:

  name: poc-app

  labels:

    app: poc-app

spec:

  replicas: 2

  selector:

    matchLabels:

      app: poc-app

  template:

    metadata:

      labels:

        app: poc-app

    spec:

      containers:

      - name: poc-app

        image: salmanvak/poc-app:latest

        ports:

        - containerPort: 5000

---

apiVersion: v1

kind: Service

metadata:

  name: poc-app-service

spec:

  type: NodePort

  selector:

    app: poc-app

  ports:

    - port: 5000

      targetPort: 5000

      nodePort: 30080